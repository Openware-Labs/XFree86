POSTINCDIR = "/usr/lib/gcc/x86_64-pc-linux-gnu/16/include"
POSTINC_DEFINES = -DPOSTINCDIR=\"$(POSTINCDIR)\"

INC_DEFINES = $(PREINC_DEFINES) $(STDINC_DEFINES) $(POSTINC_DEFINES) 	      $(EXTRAINC_DEFINES)

OSUF = .o
OSUF_DEFINES = -DOBJSUFFIX=\"$(OSUF)\"
