all:: makedepend

bootstrap:

cleandir::
	$(RM) Makefile.proto

        PROGRAM = makedepend

all:: makedepend

makedepend: $(OBJS) $(DEPLIBS)
	$(RM) $@
	$(CCLINK) -o $@ $(LDOPTIONS) $(OBJS) $(LOCAL_LIBRARIES) $(LDLIBS)  $(EXTRA_LOAD_FLAGS)

install:: makedepend
	@if [ -d $(DESTDIR)$(BINDIR) ]; then \
		set +x; \
	else \
		if [ -h $(DESTDIR)$(BINDIR) ]; then \
			(set -x; rm -f $(DESTDIR)$(BINDIR)); \
		fi; \
		(set -x; $(MKDIRHIER) $(DESTDIR)$(BINDIR)); \
	fi
	$(INSTALL) $(INSTALLFLAGS) $(INSTPGMFLAGS)  makedepend $(DESTDIR)$(BINDIR)/makedepend

depend:: $(DEPEND)

$(DEPEND):
	@echo "checking $@ over in $(DEPENDSRC) first..."; \
	cd $(DEPENDSRC) && $(MAKE); \
	echo "okay, continuing in $(CURRENT_DIR)"

depend::
	$(DEPEND) $(DEPENDFLAGS) -- $(ALLDEFINES) $(DEPEND_DEFINES) -- $(SRCS)

lint:
	$(LINT) $(LINTFLAGS) $(SRCS) $(LINTLIBS)
lint1:
	$(LINT) $(LINTFLAGS) $(FILE) $(LINTLIBS)

cleandir::
	$(RM) makedepend

main.o:	main.c $(ICONFIGFILES)
	$(RM) $@
	 	$(CC) -c $(CFLAGS) $(MAIN_DEFINES) $*.c

main.i: main.c $(ICONFIGFILES)
	$(RM) $@
	 	$(CC) -E $(CFLAGS) $(MAIN_DEFINES) main.c > $@

main.s: main.c $(ICONFIGFILES)
	$(RM) $@
	 	$(CC) -S $(CFLAGS) $(MAIN_DEFINES) $*.c

all:: makedepend.$(MANSUFFIX).html

makedepend.$(MANSUFFIX).html: mkdepend.$(MANNEWSUFFIX) $(RMAN)
	$(RM) makedepend.$(MANSUFFIX).html makedepend.$(MANSUFFIX)-html
	$(RMAN) $(RMANOPTIONS) < mkdepend.$(MANNEWSUFFIX) \
	  > makedepend.$(MANSUFFIX)-html && $(MV) makedepend.$(MANSUFFIX)-html $@

install.man:: makedepend.$(MANSUFFIX).html
	@if [ -d $(DESTDIR)$(DOCHTMLDIR) ]; then \
		set +x; \
	else \
		if [ -h $(DESTDIR)$(DOCHTMLDIR) ]; then \
			(set -x; rm -f $(DESTDIR)$(DOCHTMLDIR)); \
		fi; \
		(set -x; $(MKDIRHIER) $(DESTDIR)$(DOCHTMLDIR)); \
	fi
	@(SUF=`expr $(MANSUFFIX) \: '\(.\)'`; \
	 set -x; \
	 $(INSTALL) $(INSTALLFLAGS) $(INSTMANFLAGS) makedepend.$(MANSUFFIX).html $(DESTDIR)$(DOCHTMLDIR)/makedepend.$$SUF.html)

cleandir::
	$(RM) makedepend.$(MANSUFFIX).html makedepend.$(MANSUFFIX)-html

all:: mkdepend.$(MANNEWSUFFIX)

mkdepend.$(MANNEWSUFFIX)::  mkdepend.$(MANSRCSUFFIX)
	$(RM) $@
	 	$(RAWCPP)  $(MANDEFS) $(EXTRAMANDEFS) <mkdepend.$(MANSRCSUFFIX) | sed -e '/^#  *[0-9][0-9]*  *.*$$/d' -e '/^XCOMM$$/s//#/' -e '/^XCOMM[^a-zA-Z0-9_]/s/^XCOMM/#/' >$@

cleandir::
	$(RM) mkdepend.$(MANNEWSUFFIX)

install.man:: mkdepend.$(MANNEWSUFFIX)
	@if [ -d $(DESTDIR)$(MANDIR) ]; then \
		set +x; \
	else \
		if [ -h $(DESTDIR)$(MANDIR) ]; then \
			(set -x; rm -f $(DESTDIR)$(MANDIR)); \
		fi; \
		(set -x; $(MKDIRHIER) $(DESTDIR)$(MANDIR)); \
	fi
	$(INSTALL) $(INSTALLFLAGS) $(INSTMANFLAGS) mkdepend.$(MANNEWSUFFIX) $(DESTDIR)$(MANDIR)/makedepend.$(MANSUFFIX)

install.sdk:: makedepend
	@if [ -d $(DESTDIR)$(DRIVERSDKDIR)/config/makedepend ]; then \
		set +x; \
	else \
		if [ -h $(DESTDIR)$(DRIVERSDKDIR)/config/makedepend ]; then \
			(set -x; rm -f $(DESTDIR)$(DRIVERSDKDIR)/config/makedepend); \
		fi; \
		(set -x; $(MKDIRHIER) $(DESTDIR)$(DRIVERSDKDIR)/config/makedepend); \
	fi
	$(INSTALL) -c $(INSTBINFLAGS) makedepend $(DESTDIR)$(DRIVERSDKDIR)/config/makedepend/makedepend

